<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MapTiler 中国大陆访问测试</title>
<link href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7f8;color:#17191c}
body{display:flex;flex-direction:column}
.topbar{padding:calc(14px + env(safe-area-inset-top)) 16px 12px;background:rgba(255,255,255,.96);border-bottom:1px solid #e7e9ec;z-index:10}
.title{margin:0;font-size:18px;font-weight:700}
.desc{margin:6px 0 0;color:#6b7280;font-size:13px;line-height:1.5}
#status{margin-top:10px;padding:9px 11px;border-radius:10px;background:#eef0f2;font-size:13px;line-height:1.45;word-break:break-word}
#map{flex:1;min-height:0}
.marker{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ef6b63;color:#fff;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:13px;font-weight:700}
.maplibregl-popup-content{border-radius:12px;padding:10px 12px;font-size:13px}
</style>
</head>
<body>
<div class="topbar">
  <h1 class="title">MapTiler 中国大陆访问测试</h1>
  <p class="desc">如果下方能正常显示全球地图，并且可拖动 / 缩放，说明这套方案基本值得继续测试。</p>
  <div id="status">页面已打开，正在加载 MapLibre…</div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
<script>
const MAPTILER_KEY = "5RSiAj4YhiUM41WUbuVI";
const statusEl = document.getElementById("status");
const setStatus = (t) => statusEl.textContent = t;

if (typeof maplibregl === "undefined") {
  setStatus("❌ MapLibre 脚本加载失败。可能是当前网络无法访问 unpkg。");
} else if (!MAPTILER_KEY || MAPTILER_KEY === "YOUR_MAPTILER_KEY") {
  setStatus("⚠️ MapLibre 已加载。请先把 HTML 里的 YOUR_MAPTILER_KEY 替换成你的 MapTiler API Key。");
} else {
  setStatus("MapLibre 已加载，正在请求 MapTiler 全球地图…");

  const map = new maplibregl.Map({
    container: "map",
    style: `https://api.maptiler.com/maps/streets-v2/style.json?key=${MAPTILER_KEY}`,
    center: [12.4964, 41.9028],
    zoom: 2.2
  });

  map.addControl(new maplibregl.NavigationControl(), "top-right");

  map.on("load", () => {
    setStatus("✅ 地图已成功加载。请尝试拖动、缩放，并查看几个国内外地点。");

    [
      {n:1,name:"上海",lng:121.4737,lat:31.2304},
      {n:2,name:"东京",lng:139.6917,lat:35.6895},
      {n:3,name:"卢布尔雅那",lng:14.5058,lat:46.0569},
      {n:4,name:"巴黎",lng:2.3522,lat:48.8566}
    ].forEach(p => {
      const el = document.createElement("div");
      el.className = "marker";
      el.textContent = p.n;
      new maplibregl.Marker({element:el})
        .setLngLat([p.lng,p.lat])
        .setPopup(new maplibregl.Popup({offset:18}).setHTML(
          `<strong>${p.n}. ${p.name}</strong><br>${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`
        ))
        .addTo(map);
    });
  });

  map.on("error", e => {
    const msg = e?.error?.message || "未知地图加载错误";
    setStatus("❌ 地图请求失败：" + msg);
  });

  setTimeout(() => {
    if (!map.loaded()) {
      setStatus("⚠️ 12 秒后地图仍未完全加载。若页面本身能打开但地图空白/瓦片不出，说明当前网络访问 MapTiler 可能不稳定。");
    }
  }, 12000);
}
</script>
</body>
</html>
