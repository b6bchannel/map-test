<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Photon 地点搜索诊断测试</title>
  <style>
    :root{
      --bg:#f5f6f7; --panel:#fff; --text:#17191c; --muted:#6b7280;
      --line:#e5e7eb; --soft:#eef0f2; --accent:#ef6b63;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    body{padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
    .wrap{width:min(680px,100%);margin:0 auto}
    h1{margin:0;font-size:26px;line-height:1.2;letter-spacing:-.02em}
    .intro{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.6}
    .card{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
    .label{display:block;margin-bottom:8px;font-size:13px;font-weight:650}
    input{width:100%;height:50px;border:1px solid #d7dbe0;border-radius:13px;background:#fff;color:var(--text);
      padding:0 14px;font:inherit;font-size:16px;outline:none}
    #status{margin-top:12px;padding:10px 11px;border-radius:11px;background:var(--soft);color:#4b5563;
      font-size:12px;line-height:1.5;white-space:pre-line;word-break:break-word}
    .results{margin-top:14px;display:grid;gap:8px}
    .result{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:left;padding:12px 13px}
    .result-title{font-size:15px;font-weight:680}
    .result-address{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.45}
    .result-meta{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px 10px;color:#7a8089;font-size:11px}
    .tests{margin-top:18px}
    .tests-title{margin:0 0 9px;color:var(--muted);font-size:12px}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{border:1px solid var(--line);border-radius:999px;background:#fff;color:#454b54;padding:7px 10px;font-size:12px}
    .foot{margin-top:16px;color:#8a9099;font-size:11px;line-height:1.55}
  </style>
</head>
<body>
<main class="wrap">
  <h1>Photon 地点搜索诊断</h1>
  <p class="intro">
    这版不再强制 zh。固定使用 lang=en 只控制结果展示语言，先确认 Photon 服务和搜索本身是否正常。
  </p>

  <section class="card">
    <label class="label" for="placeInput">输入地点或地址</label>
    <input id="placeInput" type="search" autocomplete="off" placeholder="先试 Berlin / Bled Castle" />
    <div id="status">等待输入。</div>
    <div id="results" class="results"></div>
  </section>

  <section class="tests">
    <p class="tests-title">先按这个顺序测：</p>
    <div class="chips">
      <button class="chip">Berlin</button>
      <button class="chip">Bled Castle</button>
      <button class="chip">Tokyo Station</button>
      <button class="chip">东京站</button>
      <button class="chip">卢浮宫</button>
      <button class="chip">上海迪士尼</button>
    </div>
  </section>

  <p class="foot">
    Search powered by Photon / OpenStreetMap data. 公开 demo 服务仅适合低频测试。
  </p>
</main>

<script>
const ENDPOINT = "https://photon.komoot.io/api";
const input = document.getElementById("placeInput");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");

let timer = null;
let controller = null;

function setStatus(t){ statusEl.textContent = t; }
function esc(v){ return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;")
  .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }

function addr(p){
  return [p.housenumber, p.street, p.district, p.city, p.county, p.state, p.postcode, p.country]
    .filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(", ");
}

async function search(q){
  if (controller) controller.abort();
  controller = new AbortController();
  resultsEl.innerHTML = "";
  const started = performance.now();
  setStatus("正在搜索…");

  const params = new URLSearchParams({
    q,
    limit:"5",
    lang:"en"
  });

  const url = `${ENDPOINT}?${params.toString()}`;

  try{
    const r = await fetch(url,{signal:controller.signal,headers:{Accept:"application/json"}});
    const raw = await r.text();
    const ms = Math.round(performance.now()-started);

    if(!r.ok){
      setStatus(`❌ HTTP ${r.status} · ${ms} ms\n${raw.slice(0,500)}`);
      return;
    }

    let data;
    try{ data = JSON.parse(raw); }
    catch{
      setStatus(`❌ 返回内容不是 JSON · ${ms} ms\n${raw.slice(0,500)}`);
      return;
    }

    const features = Array.isArray(data.features) ? data.features : [];
    setStatus(`✅ HTTP ${r.status} · ${ms} ms · ${features.length} 个结果\n请求：${url}`);

    if(!features.length) return;

    for(const f of features){
      const p = f.properties || {};
      const c = f.geometry?.coordinates || [];
      const div = document.createElement("div");
      div.className = "result";
      div.innerHTML = `
        <div class="result-title">${esc(p.name || p.street || p.city || "未命名地点")}</div>
        <div class="result-address">${esc(addr(p) || "无地址信息")}</div>
        <div class="result-meta">
          <span>${Number(c[1]).toFixed(5)}, ${Number(c[0]).toFixed(5)}</span>
          ${p.countrycode ? `<span>${esc(String(p.countrycode).toUpperCase())}</span>` : ""}
          ${p.osm_value ? `<span>${esc(p.osm_value)}</span>` : ""}
        </div>`;
      resultsEl.appendChild(div);
    }
  }catch(e){
    if(e?.name==="AbortError") return;
    setStatus(`❌ fetch 失败\n${e?.message || e}`);
  }
}

input.addEventListener("input",()=>{
  clearTimeout(timer);
  const q=input.value.trim();
  resultsEl.innerHTML="";
  if(!q){setStatus("等待输入。");return;}
  timer=setTimeout(()=>search(q),500);
});

document.querySelectorAll(".chip").forEach(b=>{
  b.addEventListener("click",()=>{
    input.value=b.textContent.trim();
    input.dispatchEvent(new Event("input"));
  });
});
</script>
</body>
</html>
