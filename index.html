<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Mapbox 中国大陆访问测试</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
  <script>
    window.__testStart = performance.now();
  </script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:#f6f7f8;
      color:#17191c;
    }
    body{display:flex;flex-direction:column}
    .topbar{
      padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
      background:rgba(255,255,255,.97);
      border-bottom:1px solid #e7e9ec;
      z-index:10;
    }
    .title{margin:0;font-size:18px;font-weight:700}
    .desc{margin:6px 0 0;color:#6b7280;font-size:13px;line-height:1.5}
    #status{
      margin-top:10px;
      padding:9px 11px;
      border-radius:10px;
      background:#eef0f2;
      font-size:13px;
      line-height:1.5;
      word-break:break-word;
      white-space:pre-line;
    }
    #map{flex:1;min-height:0}
    .marker{
      width:30px;
      height:30px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:#ef6b63;
      color:#fff;
      border:2px solid #fff;
      box-shadow:0 2px 8px rgba(0,0,0,.2);
      font-size:13px;
      font-weight:700;
    }
    .mapboxgl-popup-content{
      border-radius:12px;
      padding:10px 12px;
      font-size:13px;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1 class="title">Mapbox 中国大陆访问测试</h1>
    <p class="desc">
      目标：测试大陆手机网络下，Mapbox 自己的 JS/CSS/CDN 和全球底图实际加载速度。
    </p>
    <div id="status">页面已打开，正在检查 Mapbox GL JS…</div>
  </div>

  <div id="map"></div>

  <script>
    // 把下面这一行替换成你自己的 Mapbox Public Access Token（通常以 pk. 开头）
    const MAPBOX_TOKEN = "pk.eyJ1IjoiaGFpZGVlbHVvIiwiYSI6ImNtdWllbzUweTA3YzAzMW9ndjdmcGJ4bzUifQ.ZVjMkFTYQf4HcuiCK-lSyg";

    const statusEl = document.getElementById("status");
    const startedAt = window.__testStart || performance.now();

    function elapsed() {
      return ((performance.now() - startedAt) / 1000).toFixed(1);
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    if (typeof mapboxgl === "undefined") {
      setStatus(
        "❌ Mapbox GL JS 没有加载成功。\n" +
        "耗时：" + elapsed() + " 秒\n" +
        "如果这里失败，说明 api.mapbox.com 本身在当前网络就有问题。"
      );
    } else if (!MAPBOX_TOKEN || MAPBOX_TOKEN === "YOUR_MAPBOX_PUBLIC_TOKEN") {
      setStatus(
        "⚠️ Mapbox GL JS 已加载。\n" +
        "JS 加载到可用耗时：" + elapsed() + " 秒\n" +
        "请先把 HTML 里的 YOUR_MAPBOX_PUBLIC_TOKEN 替换成你的 Mapbox Public Access Token。"
      );
    } else {
      const jsReadySeconds = elapsed();

      setStatus(
        "Mapbox GL JS 已加载（" + jsReadySeconds + " 秒）。\n" +
        "正在请求全球地图数据…"
      );

      mapboxgl.accessToken = MAPBOX_TOKEN;

      const map = new mapboxgl.Map({
        container: "map",
        style: "mapbox://styles/mapbox/streets-v12",
        center: [12.4964, 41.9028],
        zoom: 2.1
      });

      map.addControl(new mapboxgl.NavigationControl(), "top-right");

      map.on("load", () => {
        const mapLoadedSeconds = elapsed();

        setStatus(
          "✅ 地图已成功加载。\n" +
          "Mapbox GL JS 可用：" + jsReadySeconds + " 秒\n" +
          "地图完成 load：" + mapLoadedSeconds + " 秒\n" +
          "请继续拖动、缩放地图，观察瓦片是否会长时间空白。"
        );

        const points = [
          { n: 1, name: "上海", lng: 121.4737, lat: 31.2304 },
          { n: 2, name: "东京", lng: 139.6917, lat: 35.6895 },
          { n: 3, name: "卢布尔雅那", lng: 14.5058, lat: 46.0569 },
          { n: 4, name: "巴黎", lng: 2.3522, lat: 48.8566 }
        ];

        points.forEach((p) => {
          const el = document.createElement("div");
          el.className = "marker";
          el.textContent = p.n;

          new mapboxgl.Marker({ element: el })
            .setLngLat([p.lng, p.lat])
            .setPopup(
              new mapboxgl.Popup({ offset: 18 }).setHTML(
                `<strong>${p.n}. ${p.name}</strong><br>${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`
              )
            )
            .addTo(map);
        });
      });

      map.on("error", (e) => {
        const message = e && e.error && e.error.message
          ? e.error.message
          : "未知地图加载错误";

        setStatus(
          "❌ Mapbox 地图请求发生错误。\n" +
          "当前耗时：" + elapsed() + " 秒\n" +
          "错误：" + message
        );
      });

      setTimeout(() => {
        if (!map.loaded()) {
          setStatus(
            "⚠️ 10 秒后地图仍未完全加载。\n" +
            "Mapbox GL JS 可用：" + jsReadySeconds + " 秒\n" +
            "当前总耗时：" + elapsed() + " 秒\n" +
            "如果最终能出图但持续很慢，也不适合作为正式方案。"
          );
        }
      }, 10000);

      setTimeout(() => {
        if (!map.loaded()) {
          setStatus(
            "❌ 30 秒后地图仍未完全加载。\n" +
            "当前总耗时：" + elapsed() + " 秒\n" +
            "这基本可以判定当前大陆网络下体验不合格。"
          );
        }
      }, 30000);
    }
  </script>
</body>
</html>
